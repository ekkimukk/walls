<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>walls</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="gallery" class="gallery"></div>
    <div id="error" class="error hidden"></div>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button id="close" class="close" aria-label="Закрыть">×</button>
    <button id="prev" class="nav prev" aria-label="Предыдущие">‹</button>
    <img id="lightbox-image" alt="">
    <button id="next" class="nav next" aria-label="Следующие">›</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
